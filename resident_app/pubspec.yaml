name: adda_housing_resident
description: Adda Housing - Resident App for Society Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_bloc: ^8.1.3
  provider: ^6.1.1
  
  # Network
  http: ^1.1.0
  dio: ^5.3.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  
  # Forms
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Media
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  
  # Push Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^16.3.2
  
  # Payments
  razorpay_flutter: ^1.3.7
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.4
  permission_handler: ^11.1.0
  connectivity_plus: ^5.0.2
  qr_flutter: ^4.1.0
  
  # Charts
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
